name: "base-gemma2-9b"
description: "Base Gemma 2 9B Instruct (no fine-tuning) on original DNRTI dataset"
base_model: "unsloth/gemma-2-9b-it"
base_gguf: "gemma2-9b-it-fp16.gguf"

ner_lora: null
re_lora: null

dataset:
  source: "datasets/DNRTI/dnrti_aug_stix2_je.json"
  split_dir: "datasets/DNRTI/splits"
  train: 6429
  val: 722
  test: 707
  train_test_text_overlap: 205

training: null

notes: |
  Zero-shot baseline using the base Gemma 2 9B Instruct model with no
  fine-tuning or LoRA adapters. Same prompts as the fine-tuned variant.
  Measures how much the LoRA fine-tuning contributes over the base model.
