# dataset_mode controls how the pipeline scopes processing:
#   sentence  - each entry is independent (DNRTI: unrelated sentences)
#   document  - entries are multi-chunk documents (CTI-HAL: full reports)
dataset_mode: document

modules:
  repair: true
  canonicalization: true
  semantic_chunking: false
  graph_insertion: true
  similarity: true
  reranking: false