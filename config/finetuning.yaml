base_model: "unsloth/gemma-2-9b-it"
output_dir: "C:/CTI/results/finetuning"
use_unsloth: true

data:
  dataset_path: "C:/CTI/datasets/DNRTI/dnrti_dedup.json"
  val_ratio: 0.10
  test_ratio: 0.10
  min_triples_per_doc: 1
  include_negatives: true
  negative_ratio: 0.15
  task_mix_ratio: 0.85
  task: "joint"  # "ner", "re", or "joint"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  exclude_modules:
    - vision_tower

training:
  epochs: 3
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2e-4
  max_seq_length: 1024
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 999
  eval_steps: 999
  seed: 42
  completion_only: true

export:
  quantization: "f16"
  model_name: "gemma3-cti"
